// Resolve artifacts as data in a plain Gradle project. Do not apply AGP here.
plugins {
    id 'java'
}

repositories {
    google()
    mavenCentral()
}

configurations {
    agpToolchain
    appLibraries
    appApiLibraries
    testLibraries
    testApiLibraries
    testRuntimeLibraries
    lintToolchain
    resourceCompiler
}

['agpToolchain', 'appLibraries', 'appApiLibraries', 'testLibraries', 'testApiLibraries',
        'testRuntimeLibraries', 'lintToolchain', 'resourceCompiler'].each { name ->
    configurations.named(name) {
        canBeConsumed = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        }
    }
}

configurations.named('appApiLibraries') {
    extendsFrom(configurations.appLibraries)
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
    }
}
configurations.named('testApiLibraries') {
    extendsFrom(configurations.appLibraries, configurations.testLibraries)
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
    }
}
configurations.named('testRuntimeLibraries') {
    extendsFrom(configurations.appLibraries, configurations.testLibraries)
}

dependencies {
    agpToolchain 'com.android.tools.build:gradle:9.3.3'
    appLibraries 'androidx.browser:browser:1.10.0'
    appLibraries 'androidx.core:core:1.13.0'
    // Match the app's compile visibility for named manifest-removal markers.
    // Both artifacts already belong to the pinned Browser runtime graph.
    appLibraries 'androidx.startup:startup-runtime:1.1.1'
    appLibraries 'androidx.profileinstaller:profileinstaller:1.3.1'
    // AGP's built-in Kotlin support adds this metadata-only forwarder even
    // when the application has no Kotlin sources. Capture it before AGP runs.
    appLibraries 'org.jetbrains.kotlin:kotlin-stdlib-common:2.2.10'
    testLibraries 'junit:junit:4.13.2'
    lintToolchain 'com.android.tools.lint:lint-gradle:32.3.3'
    lintToolchain 'com.android.tools.lint:lint:32.3.3'
    resourceCompiler 'com.android.tools.build:aapt2:9.3.3-15703166:windows'
}

tasks.register('resolveArtifacts') {
    doLast {
        def inventory = []
        ['agpToolchain', 'appLibraries', 'appApiLibraries', 'testLibraries', 'testApiLibraries',
                'testRuntimeLibraries', 'lintToolchain', 'resourceCompiler'].each { name ->
            def artifacts = configurations.getByName(name).incoming.artifacts.artifacts
            artifacts.each { artifact ->
                inventory.add([
                    configuration: name,
                    component: artifact.id.componentIdentifier.displayName,
                    fileName: artifact.file.name,
                    sha256: java.security.MessageDigest.getInstance('SHA-256')
                            .digest(artifact.file.bytes).encodeHex().toString()
                ])
            }
            logger.lifecycle("Resolved ${name}: ${artifacts.size()} pinned artifacts")
        }
        def report = layout.buildDirectory.file('reports/dependencies/artifacts.json').get().asFile
        report.parentFile.mkdirs()
        report.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
                inventory.sort { a, b -> (a.component <=> b.component) ?: (a.fileName <=> b.fileName) })) + '\n'
        logger.lifecycle("Artifact SHA-256 inventory: ${report}")
    }
}
