import com.android.build.api.variant.HostTestBuilder
import org.gradle.api.DefaultTask
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.tasks.InputDirectory
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.TaskAction

plugins {
    id 'com.android.application'
}

abstract class SyncOfflineAssets extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getFrom()

    @OutputDirectory
    abstract DirectoryProperty getInto()

    @TaskAction
    void sync() {
        File root = into.get().asFile
        project.delete(root)
        project.copy {
            from(from.get().asFile)
            into(new File(root, 'www'))
        }
    }
}

def offlineAssets = tasks.register('syncOfflineAssets', SyncOfflineAssets) {
    from.set(layout.projectDirectory.dir('../../frontend/dist-offline'))
    into.set(layout.buildDirectory.dir('generated/offlineAssets'))
}

android {
    namespace = 'ru.mathege.preview'
    compileSdk = 37
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId = 'ru.mathege.preview'
        minSdk = 23
        targetSdk = 37
        versionCode = 2
        versionName = '0.2.0-offline-preview'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
        warningsAsErrors = true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(offlineAssets) { task -> task.into }
    }
    beforeVariants(selector().withBuildType('release')) { variantBuilder ->
        // AGP 9.3 registers only debug host tests by default. Keep a release gate.
        variantBuilder.hostTests.get(HostTestBuilder.UNIT_TEST_TYPE).enable = true
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.core:core:1.13.0'
    // These exact versions already belong to Browser's runtime graph. Expose
    // their symbols to lint for the named manifest-removal markers; no new
    // runtime artifact or component is introduced.
    implementation 'androidx.startup:startup-runtime:1.1.1'
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
    testImplementation 'junit:junit:4.13.2'
}
