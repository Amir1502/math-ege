worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log off;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    upstream api_backend {
        zone api_backend 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        server api:8000 resolve;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        error_page 413 = @body_too_large;
        error_page 429 = @rate_limited;
        error_page 502 = @bad_gateway;
        error_page 504 = @gateway_timeout;

        location @body_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"body_too_large","message":"Запрос слишком большой. Сократите ввод и повторите отправку.","field":null}}';
        }

        location @rate_limited {
            default_type application/json;
            return 429 '{"error":{"code":"rate_limited","message":"Слишком много запросов. Подождите немного и повторите отправку.","field":null}}';
        }

        location @bad_gateway {
            default_type application/json;
            return 502 '{"error":{"code":"service_unavailable","message":"Сервер временно недоступен. Черновик остаётся на устройстве; повторите отправку позже.","field":null}}';
        }

        location @gateway_timeout {
            default_type application/json;
            return 504 '{"error":{"code":"gateway_timeout","message":"Сервер не ответил вовремя. Черновик остаётся на устройстве; повторите отправку.","field":null}}';
        }

        location = /healthz {
            default_type text/plain;
            return 200 'ok';
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_buffering off;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        location = /sw.js {
            try_files $uri =404;
            expires -1;
        }

        location = /manifest.webmanifest {
            try_files $uri =404;
            expires -1;
        }

        location = /api/openapi.json {
            proxy_pass http://api_backend/openapi.json;
            proxy_set_header Host $http_host;
        }

        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
